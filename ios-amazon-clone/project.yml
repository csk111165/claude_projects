name: NovaMart
options:
  bundleIdPrefix: com.novamart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false

targets:
  NovaMart:
    type: application
    platform: iOS
    sources:
      - path: NovaMart
        excludes:
          - "**/*.plist"
    info:
      path: NovaMart/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novamart.app
        INFOPLIST_FILE: NovaMart/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"

  NovaMartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaMartTests
    dependencies:
      - target: NovaMart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novamart.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NovaMart.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NovaMart"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NovaMartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NovaMartUITests
    dependencies:
      - target: NovaMart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novamart.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NovaMart
